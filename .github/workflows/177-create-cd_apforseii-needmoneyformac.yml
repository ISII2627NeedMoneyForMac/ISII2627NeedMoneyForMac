name: Build and deploy ASP.Net Core app to Azure Web App - apforseii-needmoneyformac

on:
  push:
    branches:
      - '177-create-cd'
  pull_request:
    branches:
      - 'development'
    types:
      - closed
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout
    env:
      API: ./src/AppForSEII.API/AppForSEII.API.csproj

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore ${{ env.API }}

      - name: Build with dotnet
        run: dotnet build ${{ env.API }} --configuration Release --no-restore

      - name: dotnet publish
        run: dotnet publish ${{ env.API }} -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    # Solo despliega si la PR se cerró porque fue mergeada
    if: github.event.pull_request.merged == true
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      # - name: Login to Azure
      #   uses: azure/login@v2
      #   with:
      #     client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A67923BE7C6D4078B5E49B23AD0B124F }}
      #     tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1A72DF31D9014A87B27F50F6649B1510 }}
      #     subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_95CDEBECBEE24C0F8CC7E17DF165EAB6 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'apforseii-needmoneyformac'
          # slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_SAUL }}
          package: .